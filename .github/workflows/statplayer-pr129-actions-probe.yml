name: StatPlayer PR129 Actions probe

on:
  push:
    branches:
      - gpt/statplayer-pr129-actions-probe-20260802

permissions:
  contents: write

jobs:
  prove-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          printf 'workflow=%s\nrun_id=%s\ninput_head=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > statplayer-pr129-actions-proof.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statplayer-pr129-actions-proof.txt
          git commit -m 'ci: record StatPlayer PR129 Actions probe [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
